<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogos da Turma</title>
<meta name="description" content="Jogos de mesa pra jogar com os amigos, direto do celular. Sem baixar nada.">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<style>
/* Só o que é da base. O visual comum está em comum.css. */
.jogo{display:block;text-decoration:none;color:inherit;margin-bottom:18px;
  transition:transform .1s ease,box-shadow .1s ease}
a.jogo:hover{transform:translate(-2px,-2px);box-shadow:11px 11px 0 var(--preto)}
a.jogo:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--preto)}
a.jogo:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
.jogo:nth-child(odd){transform:rotate(-.6deg)}
.jogo:nth-child(even){transform:rotate(.5deg)}
.emoji{font-size:20px;line-height:1}
.nome{font-family:var(--display);font-weight:900;font-size:clamp(30px,8.5vw,42px);
  line-height:1;letter-spacing:-.035em}
.tagline{font-weight:500;font-size:15.5px;line-height:1.4;margin-top:9px}
.desc{font-size:13.5px;line-height:1.55;color:var(--cinza);margin-top:11px}
.fichas{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.ficha{font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;border:2.5px solid var(--preto);border-radius:99px;
  padding:5px 11px;background:var(--branco)}
.abrir{margin-top:15px;font-family:var(--display);font-weight:900;font-size:15px}
.jogo.travado{opacity:.62}
.jogo.travado .abrir{color:var(--cinza)}
.vazio{text-align:center;padding:34px 18px}
</style>
</head>
<body>
<div id="app">

  <div class="carta" style="transform:rotate(-1deg);margin-bottom:26px">
    <div class="faixa" style="--cor:var(--coral)"><span>Escolha o jogo</span><span id="quantos"></span></div>
    <div class="corpo" style="text-align:center;padding:24px 18px 22px">
      <img src="logo.svg" width="92" height="92" alt=""
           style="display:block;margin:0 auto 14px">
      <p class="marca" style="font-size:clamp(42px,13vw,60px)">JOGOS<br>DA TURMA</p>
      <p style="margin-top:14px;font-weight:500;font-size:15px;line-height:1.45;max-width:30ch;margin-inline:auto">
        Jogos de mesa pra jogar com os amigos, direto do celular. Sem baixar nada.
      </p>
    </div>
  </div>

  <div id="lista"></div>

  <p class="fraco" style="margin-top:26px;font-size:12px;text-align:center">
    Feito em casa. Código aberto em
    <a href="https://github.com/leoborja/jogos-da-turma">github.com/leoborja/jogos-da-turma</a>.
  </p>
</div>

<script>
"use strict";
const escapar = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const SELO = {pronto:"Jogar agora", construindo:"Em construção", ideia:"Ideia na fila"};

function desenhar(jogos){
  const lista = document.getElementById("lista");
  const prontos = jogos.filter(j => j.status === "pronto").length;
  document.getElementById("quantos").textContent =
    prontos === 1 ? "1 jogo" : prontos + " jogos";

  if (!jogos.length){
    lista.innerHTML = '<div class="carta"><div class="corpo vazio">' +
      '<p class="nome" style="font-size:26px">Nada aqui ainda</p>' +
      '<p class="fraco" style="margin-top:10px">O primeiro jogo está a caminho.</p>' +
      '</div></div>';
    return;
  }

  lista.innerHTML = jogos.map(j => {
    const pronto = j.status === "pronto";
    const fichas = [j.jogadores && j.jogadores + " pessoas", j.duracao, j.precisa]
      .filter(Boolean).map(t => `<span class="ficha">${escapar(t)}</span>`).join("");
    const miolo = `
      <div class="faixa" style="--cor:var(--${escapar(j.cor)})">
        <span><span class="emoji">${escapar(j.emoji)}</span></span>
        <span>${escapar(SELO[j.status] || j.status)}</span>
      </div>
      <div class="corpo">
        <p class="nome">${escapar(j.nome)}</p>
        <p class="tagline">${escapar(j.tagline)}</p>
        ${j.descricao ? `<p class="desc">${escapar(j.descricao)}</p>` : ""}
        <div class="fichas">${fichas}</div>
        <p class="abrir">${pronto ? "Abrir o jogo →" : "Ainda não dá pra jogar"}</p>
      </div>`;
    return pronto
      ? `<a class="carta jogo" href="${escapar(j.slug)}/">${miolo}</a>`
      : `<div class="carta jogo travado">${miolo}</div>`;
  }).join("");
}

fetch("jogos.json", {cache:"no-cache"})
  .then(r => { if (!r.ok) throw new Error("jogos.json não carregou (HTTP " + r.status + ")"); return r.json(); })
  .then(d => desenhar(d.jogos || []))
  .catch(e => {
    document.getElementById("lista").innerHTML =
      `<div class="aviso errado">${escapar(e.message)} — rode <code>python3 atualizar_jogos.py</code>.</div>`;
  });
</script>
</body>
</html>
