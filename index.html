<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 10 — Jogos da Turma</title>
<meta name="description" content="Jogo de Top 10 com países e línguas. Dados do Banco Mundial, Glottolog e Wikidata.">
<meta name="theme-color" content="#0b120e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FBF6E9'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='17' font-weight='700' text-anchor='middle' fill='%23141310'%3E10%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --feltro:#0d1712; --feltro-alto:#16241d;
  --painel:rgba(255,255,255,.045); --painel-forte:rgba(255,255,255,.08);
  --borda:rgba(255,255,255,.11); --borda-forte:rgba(255,255,255,.2);
  --texto:#eef2ee; --fraco:#93a49a;
  --carta:#FBF6E9; --tinta:#171512; --tinta-fraca:#7c7566;
  --ouro:#E9B949; --certo:#4fdf9d; --errado:#ff7a6b; --duvida:#f0c674;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100%;font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--texto);
  background:var(--feltro);
  background-image:radial-gradient(ellipse 120% 70% at 50% -10%,var(--feltro-alto) 0%,var(--feltro) 62%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:560px;margin:0 auto;padding:18px 16px 44px}
.tela{display:none}.tela.on{display:block}
.pilha>*+*{margin-top:14px}

/* ---------------------------------------------------------- a carta */
.carta{
  position:relative;background:linear-gradient(168deg,#FEFBF3 0%,#F4EDDC 100%);
  color:var(--tinta);border-radius:20px;padding:22px 20px 18px;
  box-shadow:0 22px 45px -18px rgba(0,0,0,.85),0 3px 10px -4px rgba(0,0,0,.5),
             inset 0 1px 0 rgba(255,255,255,.85);
}
.carta::after{content:"";position:absolute;inset:9px;border:1px solid rgba(23,21,18,.14);
  border-radius:13px;pointer-events:none}
.carta.entra{animation:sobe .34s cubic-bezier(.2,.9,.25,1)}
@keyframes sobe{from{opacity:0;transform:translateY(14px) rotate(-1.2deg) scale(.97)}}
.selo{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tinta-fraca);margin-bottom:14px}
.pergunta{font-family:var(--serif);font-weight:800;font-size:clamp(27px,7.4vw,37px);
  line-height:1.06;letter-spacing:-.022em;text-wrap:balance}
.meta{font-size:12px;line-height:1.5;color:var(--tinta-fraca);margin-top:14px}
.pips{display:flex;gap:5px;margin-top:13px;align-items:center}
.pip{width:100%;height:7px;border-radius:99px;background:rgba(23,21,18,.13);
  transition:background .25s ease}
.pip.on{background:#1f9d63}
.restam{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-fraca);margin-top:9px}

/* ---------------------------------------------------------- painéis */
.bloco{background:var(--painel);border:1px solid var(--borda);border-radius:16px;padding:15px}
.rotulo{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ouro);margin-bottom:11px}
.fraco{color:var(--fraco);font-size:13.5px;line-height:1.5}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------------------------------------------------------- controles */
button{font:inherit;font-weight:600;color:var(--texto);background:var(--painel-forte);
  border:1px solid var(--borda);border-radius:11px;padding:11px 15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .1s,border-color .15s,background .15s}
button:hover{border-color:var(--borda-forte)}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed}
button.principal{width:100%;padding:16px;font-size:17px;font-weight:700;letter-spacing:.01em;
  background:var(--ouro);border-color:var(--ouro);color:#1a1405;
  box-shadow:0 8px 22px -10px rgba(233,185,73,.75)}
button.principal:hover{background:#f2c65e;border-color:#f2c65e}
button.mini{padding:8px 12px;font-size:13.5px;font-weight:600;border-radius:9px}
button.perigo{color:var(--errado);border-color:rgba(255,122,107,.3)}
button.on{background:rgba(233,185,73,.15);border-color:rgba(233,185,73,.55);color:var(--ouro)}
button.modo,button.mini{opacity:.62}
button.modo.on,button.mini.on{opacity:1}
#lista-jogadores button,#contestantes button,#acoes-juiz button,#passou{opacity:1}
#btn-palpite{background:var(--ouro);border-color:var(--ouro);color:#1a1405;opacity:1;
  padding:13px 18px;font-weight:700}
#btn-palpite:hover{background:#f2c65e}
input,select{font:inherit;color:var(--texto);background:rgba(0,0,0,.28);
  border:1px solid var(--borda);border-radius:11px;padding:13px;width:100%}
input::placeholder{color:#6d7c73}
input:focus,select:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(233,185,73,.16)}
label{font-size:12.5px;color:var(--fraco);display:block;margin-bottom:6px}

/* ---------------------------------------------------------- jogadores */
.jogadores{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.jogadores::-webkit-scrollbar{display:none}
.jogador{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:center;
  padding:9px 15px;border-radius:13px;background:var(--painel);border:1px solid var(--borda);
  transition:all .2s}
.jogador span:first-child{font-weight:600;font-size:14.5px;white-space:nowrap}
.jogador.vez{background:rgba(233,185,73,.14);border-color:var(--ouro);
  box-shadow:0 0 0 3px rgba(233,185,73,.12)}
.jogador.fora{opacity:.32}
.vidas{display:flex;gap:4px;font-size:11px;color:var(--ouro);letter-spacing:1px}
.jogador.fora .vidas{color:var(--fraco);letter-spacing:0;font-size:10.5px;font-weight:700;
  text-transform:uppercase}

/* ---------------------------------------------------------- feedback */
.aviso{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;border-radius:14px;
  font-size:15px;font-weight:600;line-height:1.4;border:1px solid;animation:aparece .22s ease}
@keyframes aparece{from{opacity:0;transform:translateY(-6px)}}
.aviso::before{font-family:var(--serif);font-size:17px;line-height:1.15;flex:0 0 auto}
.aviso.certo{background:rgba(79,223,157,.11);border-color:rgba(79,223,157,.32);color:var(--certo)}
.aviso.certo::before{content:"✓"}
.aviso.errado{background:rgba(255,122,107,.11);border-color:rgba(255,122,107,.32);color:var(--errado)}
.aviso.errado::before{content:"✕"}
.aviso.duvida{background:rgba(240,198,116,.1);border-color:rgba(240,198,116,.3);color:var(--duvida)}
.aviso.duvida::before{content:"?"}

/* ---------------------------------------------------------- gabarito */
.lista{list-style:none;padding:0;display:grid;gap:5px}
.item{display:flex;gap:11px;align-items:baseline;padding:10px 12px;border-radius:10px;
  background:rgba(0,0,0,.24);font-size:15px}
.item .pos{font-family:var(--serif);font-weight:800;color:var(--fraco);
  font-variant-numeric:tabular-nums;min-width:20px;font-size:14px}
.item .val{margin-left:auto;color:var(--fraco);font-size:12.5px;
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item.oculto .nome,.item.oculto .val{filter:blur(7px);user-select:none}
.item.achado{background:rgba(79,223,157,.13);color:var(--certo)}
.item.achado .pos,.item.achado .val{color:var(--certo);opacity:.75}
details>summary{cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--fraco);
  display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";transition:transform .2s}
details[open]>summary::after{transform:rotate(180deg)}

/* ---------------------------------------------------------- diversos */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.dito{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;
  background:rgba(0,0,0,.28);color:var(--fraco);border:1px solid transparent}
.dito.certo{color:var(--certo);border-color:rgba(79,223,157,.28)}
.dito.errado{color:var(--errado);border-color:rgba(255,122,107,.26)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modo{padding:14px 12px;text-align:center;line-height:1.3;border-radius:13px}
.contador{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--fraco)}
.marca{font-family:var(--serif);font-weight:800;letter-spacing:-.03em;line-height:.88}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

<!-- ------------------------------------------------ configuração -->
<section id="tela-setup" class="tela on">
  <div class="carta" style="text-align:center;padding:30px 20px 24px">
    <p class="selo" style="justify-content:center;margin-bottom:10px">Jogos da Turma</p>
    <p class="marca" style="font-size:clamp(52px,17vw,76px)">Top 10</p>
    <p class="meta" style="margin-top:12px;max-width:34ch;margin-inline:auto">
      A carta pergunta, a resposta é um ranking de dez. Vocês vão falando —
      sem repetir, e sem errar.
    </p>
  </div>

  <div class="bloco pilha" style="margin-top:14px">
    <p class="rotulo">Quem vai jogar</p>
    <div id="lista-jogadores" class="chips"></div>
    <form id="form-jogador" class="linha">
      <input id="nome-jogador" placeholder="nome" autocomplete="off" style="flex:1;min-width:0">
      <button type="submit">Entrar</button>
    </form>
  </div>

  <div class="bloco pilha">
    <p class="rotulo">Como vocês jogam</p>
    <div class="grade2">
      <button class="modo on" data-modo="juiz">Com juiz</button>
      <button class="modo" data-modo="contesto">Sem juiz</button>
    </div>
    <p class="fraco" id="explica-modo"></p>
    <div>
      <label for="vidas">Vidas por jogador</label>
      <select id="vidas">
        <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
      </select>
    </div>
  </div>

  <div class="bloco pilha">
    <div class="entre"><p class="rotulo" style="margin:0">Baralho</p>
      <span class="contador" id="resumo-banco">carregando…</span></div>
    <div><label>Tema</label><div class="chips" id="filtro-tema"></div></div>
    <div><label>Recorte</label><div class="chips" id="filtro-escopo"></div></div>
    <p class="fraco" id="conta-cartas"></p>
  </div>

  <button class="principal" id="comecar" style="margin-top:16px">Embaralhar e começar</button>
  <p class="fraco" style="margin-top:16px;font-size:12px;opacity:.7" id="creditos"></p>
</section>

<!-- ------------------------------------------------ rodada -->
<section id="tela-jogo" class="tela">
  <div class="entre" style="margin-bottom:14px">
    <button class="mini" id="voltar">‹ Sair</button>
    <span class="contador" id="placar-baralho"></span>
  </div>

  <div class="carta" id="carta-jogo">
    <div class="selo"><span id="badge"></span><span>Top 10</span></div>
    <p class="pergunta" id="pergunta"></p>
    <div class="pips" id="pips"></div>
    <p class="restam" id="progresso"></p>
    <p class="meta" id="meta"></p>
  </div>

  <div class="jogadores" id="painel-jogadores" style="margin-top:14px"></div>

  <div id="resultado" style="margin-top:14px"></div>

  <div class="bloco linha" id="acoes-contesto" hidden style="margin-top:14px">
    <button class="mini" id="passou">Ninguém contestou</button>
    <span class="fraco">ou quem contestou:</span>
    <span class="chips" id="contestantes"></span>
  </div>

  <div class="bloco pilha" id="painel-palpite" style="margin-top:14px">
    <p class="rotulo" id="titulo-palpite" style="color:var(--ouro)"></p>
    <form id="form-palpite" class="linha">
      <input id="palpite" placeholder="o que a pessoa falou" autocomplete="off"
             autocapitalize="off" spellcheck="false" list="sugestoes" style="flex:1;min-width:0">
      <datalist id="sugestoes"></datalist>
      <button type="submit" id="btn-palpite">Vale?</button>
    </form>
    <div class="linha" id="acoes-juiz" hidden>
      <span class="fraco">Não reconheci. O juiz decide:</span>
      <button class="mini" id="forcar-certo">Foi acerto</button>
      <button class="mini perigo" id="forcar-errado">Foi erro</button>
    </div>
    <div class="chips" id="ditos"></div>
  </div>

  <details class="bloco" id="gabarito-caixa" style="margin-top:14px">
    <summary>Ver o gabarito (só o juiz)</summary>
    <ul class="lista" id="gabarito" style="margin-top:12px"></ul>
  </details>

  <div class="pilha" style="margin-top:14px">
    <button class="principal" id="proxima" hidden>Próxima carta</button>
    <button class="mini" id="desistir" style="width:100%">Encerrar rodada e revelar</button>
  </div>
</section>

</div>

<script>

"use strict";

/* ------------------------------------------------------------------ dados */
const S = {
  banco:null, indice:new Map(), jogadores:[], vidas:3, modo:"juiz",
  temas:new Set(), escopos:new Set(), baralho:[], usadas:new Set(),
  carta:null, achados:new Set(), ditos:[], vez:0, fim:false, ultimo:null, pendente:null,
};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"")
  .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

/* Levenshtein com corte: só precisamos saber se a distância é <= max. */
function perto(a, b, max){
  if (Math.abs(a.length - b.length) > max) return false;
  let ant = [...Array(b.length+1).keys()];
  for (let i=1;i<=a.length;i++){
    const cur=[i]; let min=i;
    for (let j=1;j<=b.length;j++){
      const c = Math.min(cur[j-1]+1, ant[j]+1, ant[j-1]+(a[i-1]===b[j-1]?0:1));
      cur.push(c); if (c<min) min=c;
    }
    if (min>max) return false;
    ant=cur;
  }
  return ant[b.length]<=max;
}

/* Resolve o que a pessoa falou. Devolve {tipo, chave, nome} ou null.
   Primeiro procura no índice global de países (assim "Holanda" vira NLD mesmo
   que a carta seja de língua), depois tenta erro de digitação. */
function resolver(txt){
  const n = norm(txt);
  if (!n) return null;
  if (S.indice.has(n)) { const i=S.indice.get(n); return {tipo:"pais",chave:i,nome:S.banco.paises[i].nome}; }

  // resposta da carta que não é país (língua, família linguística)
  for (const r of S.carta.respostas){
    if (!r.iso3 && (norm(r.nome)===n || (r.apelidos||[]).includes(n)))
      return {tipo:"outro", chave:r.nome, nome:r.nome};
  }

  // erro de digitação: aceita só se sobrar um candidato
  const max = n.length<=5 ? 1 : 2;
  const achados = new Set();
  for (const [alias,iso] of S.indice) if (perto(n,alias,max)) achados.add(iso);
  if (achados.size===1){
    const iso=[...achados][0];
    return {tipo:"pais",chave:iso,nome:S.banco.paises[iso].nome,quase:true};
  }
  return null;
}

/* ------------------------------------------------------------------ setup */
async function carregar(){
  const r = await fetch("banco.json", {cache:"no-cache"});
  if (!r.ok) throw new Error("banco.json não carregou (HTTP "+r.status+")");
  S.banco = await r.json();
  for (const [iso,p] of Object.entries(S.banco.paises)){
    S.indice.set(norm(p.nome), iso);
    for (const a of p.apelidos) if (!S.indice.has(a)) S.indice.set(a, iso);
  }
  const c = S.banco.cartas;
  $("#resumo-banco").textContent = c.length + " no total";
  $("#creditos").innerHTML =
    "Dados do Banco Mundial, Glottolog e Wikidata. Banco gerado em " +
    S.banco.gerado_em + ". Cada carta mostra o ano e a fonte — o gabarito é a "
    + "palavra final na mesa.";

  montarFiltro("#filtro-tema", [...new Set(c.map(x=>x.tema))],
               t=>({paises:"Países", linguas:"Línguas"}[t]||t), S.temas);
  const ORDEM = ["mundo","Europa","África","Ásia","Américas","União Europeia"];
  const escopos = [...new Set(c.map(x=>x.escopo))]
    .sort((a,b)=>ORDEM.indexOf(a) - ORDEM.indexOf(b));
  montarFiltro("#filtro-escopo", escopos, t=>t==="mundo"?"Mundo":t, S.escopos);
  contar();
}

function montarFiltro(alvo, valores, rotulo, conjunto){
  valores.forEach(v=>conjunto.add(v));
  $(alvo).innerHTML = "";
  for (const v of valores){
    const b=document.createElement("button");
    b.className="mini on"; b.textContent=rotulo(v);
    b.onclick=()=>{
      if (conjunto.has(v)){
        if (conjunto.size===1) return;      // não deixa zerar o baralho
        conjunto.delete(v); b.classList.remove("on");
      } else { conjunto.add(v); b.classList.add("on"); }
      contar();
    };
    $(alvo).append(b);
  }
}

const elegiveis = () => S.banco.cartas.filter(
  c => S.temas.has(c.tema) && S.escopos.has(c.escopo));

function contar(){
  const n = elegiveis().length;
  $("#conta-cartas").textContent = n + (n===1?" carta no baralho":" cartas no baralho");
  $("#comecar").disabled = n===0;
}

function desenharJogadores(){
  const alvo = $("#lista-jogadores");
  alvo.innerHTML = S.jogadores.length ? "" :
    '<p class="fraco">Ninguém ainda. No modo com juiz, quem segura o celular não joga.</p>';
  S.jogadores.forEach((j,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="mini"; b.title="tirar da mesa";
    b.innerHTML = escapar(j.nome) + ' <span style="opacity:.45;margin-left:3px">✕</span>';
    b.onclick = () => { S.jogadores.splice(i,1); desenharJogadores(); };
    alvo.append(b);
  });
}
const escapar = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------------------------------------------------------------------ jogo */
function embaralhar(a){
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function comecar(){
  S.vidas = +$("#vidas").value;
  S.jogadores.forEach(j=>{ j.vidas=S.vidas; });
  S.baralho = embaralhar(elegiveis().map(c=>c.id));
  S.usadas = new Set();
  mostrar("jogo");
  proximaCarta();
}

function proximaCarta(){
  const id = S.baralho.find(x=>!S.usadas.has(x));
  if (!id){ alert("Acabaram as cartas desse baralho. Voltando pro começo."); mostrar("setup"); return; }
  S.usadas.add(id);
  S.carta = S.banco.cartas.find(c=>c.id===id);
  S.achados=new Set(); S.ditos=[]; S.fim=false; S.ultimo=null; S.pendente=null;
  $("#acoes-contesto").hidden=true; $("#acoes-juiz").hidden=true; $("#resultado").innerHTML="";
  S.jogadores.forEach(j=>{ j.vidas=S.vidas; });
  S.vez = 0;
  desenharRodada();
  const el = $("#carta-jogo");
  el.classList.remove("entra"); void el.offsetWidth; el.classList.add("entra");
  $("#palpite").focus();
}

function vivos(){ return S.jogadores.filter(j=>j.vidas>0); }

function desenharRodada(){
  const c=S.carta;
  $("#pergunta").textContent = c.pergunta;
  const partes=[c.fonte];
  if (c.ano) partes.push(c.ano);
  partes.push(c.unidade);
  partes.push(c.universo + " países no ranking");
  $("#meta").textContent = partes.join(" · ") + (c.nota ? " — " + c.nota : "");
  $("#placar-baralho").textContent = "carta " + S.usadas.size + " de " + S.baralho.length;
  $("#progresso").textContent = S.achados.size === 10
    ? "top 10 completo" : "faltam " + (10 - S.achados.size);
  $("#badge").textContent = (c.tema === "linguas" ? "Línguas" : "Países")
    + (c.escopo === "mundo" ? "" : " · " + c.escopo);
  const pips = $("#pips"); pips.innerHTML = "";
  for (let i = 0; i < 10; i++){
    const d = document.createElement("span");
    d.className = "pip" + (i < S.achados.size ? " on" : "");
    pips.append(d);
  }

  // jogadores
  const alvo=$("#painel-jogadores"); alvo.innerHTML="";
  if (!S.jogadores.length){
    alvo.innerHTML='<p class="fraco">Sem jogadores cadastrados — dá pra usar só como consulta.</p>';
  }
  S.jogadores.forEach((j,i)=>{
    const d=document.createElement("div");
    d.className="jogador"+(i===S.vez&&!S.fim&&j.vidas>0?" vez":"")+(j.vidas>0?"":" fora");
    d.innerHTML=`<span>${escapar(j.nome)}</span>
      <span class="vidas">${j.vidas>0 ? "●".repeat(j.vidas)+"○".repeat(S.vidas-j.vidas) : "fora"}</span>`;
    alvo.append(d);
  });

  // gabarito
  const g=$("#gabarito"); g.innerHTML="";
  c.respostas.forEach(r=>{
    const achado=S.achados.has(r.pos);
    const li=document.createElement("li");
    li.className="item"+(achado?" achado":(S.fim?"":" oculto"));
    li.innerHTML=`<span class="pos">${r.pos}</span><span class="nome">${escapar(r.nome)}</span>
                  <span class="val">${escapar(r.valor_fmt)}</span>`;
    g.append(li);
  });

  // já falados
  $("#ditos").innerHTML = S.ditos.map(d=>
    `<span class="dito ${d.certo?"certo":"errado"}">${escapar(d.nome)}</span>`).join("");

  const jogando = !S.fim && vivos().length>0;
  $("#painel-palpite").hidden = !jogando || !!S.pendente;
  $("#proxima").hidden = jogando;
  $("#desistir").hidden = !jogando;
  const dono = vivos().length ? S.jogadores[S.vez] : null;
  $("#titulo-palpite").textContent = S.modo==="juiz"
    ? (dono ? "Vez de " + dono.nome : "Palpite")
    : (dono ? dono.nome + " falou" : "Palpite");
  $("#btn-palpite").textContent = S.modo==="juiz" ? "Vale?" : "Contesto!";
  $("#gabarito-caixa").open = S.fim;
  if (S.fim) $("#gabarito-caixa").querySelector("summary").textContent = "Gabarito";
}

function proximaVez(){
  const vs=vivos();
  if (!vs.length) return;
  do { S.vez=(S.vez+1)%S.jogadores.length; } while (S.jogadores[S.vez].vidas<=0);
}

function avisar(classe, texto){
  $("#resultado").innerHTML = `<div class="aviso ${classe}">${escapar(texto)}</div>`;
}

function palpitar(txt){
  const alvo=resolver(txt);
  $("#acoes-juiz").hidden = true;

  if (!alvo){
    S.ultimo = {texto:txt};
    avisar("duvida", `Não reconheci "${txt}".`);
    $("#acoes-juiz").hidden = false;
    return;
  }
  if (S.ditos.some(d=>d.chave===alvo.chave)){
    avisar("duvida", alvo.nome + " já foi falado nessa rodada.");
    return;
  }

  const r = S.carta.respostas.find(x => (x.iso3||x.nome) === alvo.chave) || null;

  // No modo sem juiz ninguém pode ver se acertou: o palpite fica pendurado
  // até alguém contestar ou a mesa deixar passar.
  if (S.modo === "contesto"){
    S.pendente = {nome:alvo.nome, chave:alvo.chave, resposta:r,
                  corrigido: alvo.quase ? txt : null, de:S.vez};
    avisar("duvida", alvo.nome + " está na mesa. Contesta ou deixa passar?");
    $("#painel-palpite").hidden = true;
    desenharContesto();
    return;
  }
  registrar(alvo.nome, alvo.chave, r, alvo.quase ? txt : null);
}

function desenharContesto(){
  const box=$("#acoes-contesto"); box.hidden = !S.pendente;
  if (!S.pendente) return;
  const alvo=$("#contestantes"); alvo.innerHTML="";
  S.jogadores.forEach((j,i)=>{
    if (i===S.pendente.de || j.vidas<=0) return;
    const b=document.createElement("button");
    b.className="mini perigo"; b.textContent=j.nome;
    b.onclick=()=>resolverContesto(i);
    alvo.append(b);
  });
}

function resolverContesto(quemContestou){
  const p=S.pendente; if (!p) return;
  S.pendente=null; $("#acoes-contesto").hidden=true; $("#painel-palpite").hidden=false;
  S.ditos.push({nome:p.nome, chave:p.chave, certo:!!p.resposta});

  if (quemContestou === null){                     // ninguém contestou
    if (p.resposta) S.achados.add(p.resposta.pos);
    avisar("duvida", p.nome + " passou sem contestação.");
    proximaVez();
  } else if (p.resposta){                          // contestou e o palpite valia
    const c=S.jogadores[quemContestou]; c.vidas--;
    S.achados.add(p.resposta.pos);
    avisar("certo", `${p.nome} estava em ${p.resposta.pos}º — ${p.resposta.valor_fmt}. `
                    + `${c.nome} contestou à toa e perde uma vida.`);
    proximaVez();
  } else {                                         // contestou e pegou o blefe
    const d=S.jogadores[p.de]; d.vidas--;
    avisar("errado", `${p.nome} não está no top 10. `
                     + `${S.jogadores[quemContestou].nome} pegou o blefe: ${d.nome} perde uma vida.`);
    proximaVez();
  }
  fecharSePreciso();
  desenharRodada();
}

function fecharSePreciso(){
  if (S.achados.size===10 || vivos().length<=1) S.fim=true;
  if (S.fim) fimDeRodada();
}

function registrar(nome, chave, resposta, corrigido, forcado){
  const certo = forcado === undefined ? !!resposta : forcado;
  S.ditos.push({nome, chave, certo});
  const prefixo = corrigido ? `Entendi "${corrigido}" como ${nome}. ` : "";
  if (certo){
    if (resposta) S.achados.add(resposta.pos);
    avisar("certo", prefixo + (resposta
      ? `${nome} está em ${resposta.pos}º — ${resposta.valor_fmt}.`
      : `${nome} vale, o juiz mandou.`));
    proximaVez();
  } else {
    const j = vivos().length ? S.jogadores[S.vez] : null;
    if (j) j.vidas--;
    avisar("errado", prefixo + `${nome} não está no top 10.`
                     + (j ? ` ${j.nome} perde uma vida.` : ""));
    proximaVez();
  }
  fecharSePreciso();
  desenharRodada();
}

function fimDeRodada(){
  const vs=vivos();
  if (S.achados.size===10) avisar("certo","Top 10 completo! A mesa ganhou essa.");
  else if (vs.length===1) avisar("certo", vs[0].nome + " sobrou de pé e venceu a rodada.");
  else if (!vs.length) avisar("errado","Todo mundo caiu.");
  else avisar("duvida","Rodada encerrada. Gabarito aberto.");
}

function mostrar(qual){
  $$(".tela").forEach(t=>t.classList.remove("on"));
  $("#tela-"+qual).classList.add("on");
  window.scrollTo(0,0);
}

/* ------------------------------------------------------------------ liga */
$("#form-jogador").onsubmit = e => {
  e.preventDefault();
  const n = $("#nome-jogador").value.trim();
  if (!n) return;
  if (S.jogadores.some(j=>j.nome.toLowerCase()===n.toLowerCase())) return;
  S.jogadores.push({nome:n, vidas:3});
  $("#nome-jogador").value=""; desenharJogadores();
};

const EXPLICA = {
  juiz:"Uma pessoa segura o celular, não joga e digita o que cada um fala. "
      +"Errou, perde vida. Sai quem zerar.",
  contesto:"O celular fica no meio. Ninguém vê o gabarito. Quando alguém "
      +"desconfiar do palpite do outro, aperta Contesto — aí o app revela. "
      +"Quem contestou errado é que perde a vida.",
};
$$(".modo").forEach(b => b.onclick = () => {
  $$(".modo").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.modo=b.dataset.modo;
  $("#explica-modo").textContent = EXPLICA[S.modo];
});
$("#explica-modo").textContent = EXPLICA.juiz;

$("#comecar").onclick = comecar;
$("#voltar").onclick = () => mostrar("setup");
$("#proxima").onclick = proximaCarta;
$("#desistir").onclick = () => { S.fim=true; fimDeRodada(); desenharRodada(); };

$("#form-palpite").onsubmit = e => {
  e.preventDefault();
  const v=$("#palpite").value.trim();
  if (!v) return;
  palpitar(v);
  $("#palpite").value=""; $("#palpite").focus();
};
$("#forcar-certo").onclick = () => {
  const t=S.ultimo?.texto; if(!t) return;
  registrar(t, "livre:"+t, null, null, true);
  $("#acoes-juiz").hidden=true;
};
$("#forcar-errado").onclick = () => {
  const t=S.ultimo?.texto; if(!t) return;
  registrar(t, "livre:"+t, null, null, false);
  $("#acoes-juiz").hidden=true;
};
$("#passou").onclick = () => resolverContesto(null);

/* sugestões de digitação: só depois de 3 letras, pra não entregar resposta */
$("#palpite").oninput = e => {
  const n=norm(e.target.value); const dl=$("#sugestoes");
  if (n.length<3){ dl.innerHTML=""; return; }
  const vistos=new Set(); const out=[];
  for (const [alias,iso] of S.indice){
    if (alias.startsWith(n) && !vistos.has(iso)){
      vistos.add(iso); out.push(S.banco.paises[iso].nome);
      if (out.length>=8) break;
    }
  }
  dl.innerHTML = out.map(x=>`<option value="${escapar(x)}">`).join("");
};

desenharJogadores();
carregar().catch(e => {
  $("#resumo-banco").textContent = "erro";
  $("#tela-setup").insertAdjacentHTML("afterbegin",
    `<div class="aviso errado">${escapar(e.message)} — rode <code>python gerador.py</code> e sirva a pasta por HTTP.</div>`);
});
</script>
