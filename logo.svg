<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Jogos da Turma">
  <title>Jogos da Turma</title>
  <g stroke="#141110" stroke-width="5" stroke-linejoin="round">
    <!-- a turma: três cabeças espiando por cima da carta -->
    <circle cx="30" cy="46" r="14" fill="#FF6B6B"/>
    <circle cx="90" cy="46" r="14" fill="#74B9FF"/>
    <circle cx="60" cy="36" r="16" fill="#FFD23F"/>
    <g fill="#141110" stroke="none">
      <circle cx="25" cy="43" r="2.6"/><circle cx="35" cy="43" r="2.6"/>
      <circle cx="85" cy="43" r="2.6"/><circle cx="95" cy="43" r="2.6"/>
      <circle cx="54" cy="33" r="3"/><circle cx="66" cy="33" r="3"/>
    </g>
    <path d="M54 42q6 5 12 0" fill="none" stroke-width="3.5" stroke-linecap="round"/>
    <!-- a carta, com a pergunta desenhada como traço (não como fonte:
         assim ela é idêntica em qualquer sistema, inclusive como favicon) -->
    <g transform="rotate(-4 60 86)">
      <rect x="34" y="60" width="52" height="52" rx="9" fill="#FFFCF2"/>
      <path d="M50 78a10 10 0 1 1 10 10V95" fill="none" stroke-width="8" stroke-linecap="round"/>
      <circle cx="60" cy="104" r="4.2" fill="#141110" stroke="none"/>
    </g>
  </g>
</svg>
